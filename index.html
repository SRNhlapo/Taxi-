<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Seat</title>

     <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

   <!-- custom css -->
  <link href="css/styles.css" rel="stylesheet" />

</head>
<body>
    <div class="container py-4">
        <h1 class="h3 mb-4">Front Seat</h1>

<div id="error-box" class="alert alert-danger d-none" role="alert"></div>

<div class="row g-4 mb-4">
  <div class="col-12 col-md-6">
    <form id="payment-form" class="card card-body">
      <div class="mb-3">
        <label for="row" class="form-label">Row number</label>
        <input type="number" class="form-control" id="row">
      </div>
      <div class="mb-3">
        <label for="amountPaid" class="form-label">Amount paid (R)</label>
        <input type="number" class="form-control" id="amountPaid" step="0.01">
      </div>
      <div class="mb-3">
        <label for="passengers" class="form-label">Number of passengers</label>
        <input type="number" class="form-control" id="passengers">
        </div>
      <button type="submit" class="btn btn-primary w-100">Add payment</button>
      </form>
  </div>

<div class="col-12 col-md-6">
  <div class="card card-body">
    <h2 class="h5">Driver summary</h2>
    <p class="mb-1">Fares collected: <strong id="total-collected">R0</strong></p>
    <p class="mb-1">Passengers paid: <strong id="passengers-paid">0</strong></p>
    <p class="mb-1">Change owed in total: <strong id="change-total">R0</strong></p>
    <p class="mb-1">Change still to give: <strong id="change-outstanding">R0</strong></p>
  </div>
</div>
</div>
    <table class="table table-striped align-middle">
   <tbody id="payments-body">
    <thead>
      <tr>
        <th scope="col">Row</th>
        <th scope="col">Passengers</th>
        <th scope="col">Paid</th>
        <th scope="col">Fare</th>
        <th scope="col">Change</th>
        <th scope="col">Status</th>
        </tr>
    </thead>
  </tbody>
</table>
    </div>
  <script src="script.js"></script>
  </body>
</html>
